<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Blood Needed - Blood Rescue</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="blood-needed-page">
<div class="top-nav">
    <a href="/">Dashboard</a>
    <a href="/donate">Blood Donation</a>
    <a href="/blood-needed">Blood Needed</a>
    <a href="/urgent-blood">Urgent Blood</a>
    <a href="/logout" class="logout-button">Logout</a>
</div>

<div class="container">
    <div class="hero-card">
        <h1>Blood Needed</h1>
        <p>Share patient requests and keep the registry up to date.</p>
    </div>

    <div class="form-card">
        <h2>Post Blood Request</h2>
        <input id="patient_name" placeholder="Patient Name">
        <select id="request_blood_group">
            <option value="">Select Blood Group</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
        </select>
        <input id="request_city" placeholder="City">
        <input id="hospital" placeholder="Hospital / Location">
        <div class="location-row">
            <button type="button" onclick="captureLocation('request')">Capture Request Location</button>
        </div>
        <input id="request_latitude" type="hidden">
        <input id="request_longitude" type="hidden">
        <textarea id="details" placeholder="Details about the need"></textarea>
        <button onclick="createBloodRequest()">Submit Request</button>
    </div>

    <div class="form-card">
        <h2>Search Matching Donors</h2>
        <select id="search_blood_group">
            <option value="">Select Blood Group</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
        </select>
        <input id="search_city" placeholder="City">
        <button type="button" onclick="searchDonors()">Find Donors</button>
    </div>

    <div id="notification-banner" class="notification-banner hidden"></div>

    <h2>Current Requests</h2>
    <div class="record-grid" id="requests-list"></div>

    <h2>Search Results</h2>
    <div class="record-grid" id="donor-search-results"></div>

    <div class="map-card">
        <h2>Donor & Request Map</h2>
        <div id="search-map"></div>
    </div>
</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
